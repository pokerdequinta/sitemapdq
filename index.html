<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Código - Rebuys e Add-ons | Poker de Quinta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a2a1a 0%, #051a0e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header com Logo - estilo do site */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo img {
            max-width: 180px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.3));
        }

        .title {
            text-align: center;
            color: #ffd700;
            font-size: 2em;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 0.85em;
            margin-top: 8px;
        }

        /* Layout Principal */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        /* Cards estilo poker */
        .card {
            background: rgba(0,0,0,0.85);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #ffd700;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .card-title {
            font-size: 1.2em;
            color: #ffd700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ffd700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Botões */
        .btn {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
            margin-top: 10px;
            transition: all 0.3s;
            font-size: 13px;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #ffed4a;
        }

        .btn-primary {
            background: #ffd700;
            color: #1a1a2e;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        /* CSV Area */
        .csv-area textarea {
            width: 100%;
            height: 180px;
            background: #0a0a0a;
            border: 1px solid #ffd700;
            color: #00ff00;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            border-radius: 8px;
            resize: vertical;
        }

        /* Lista de Jogadores */
        .players-list {
            max-height: 420px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .player-card {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            transition: all 0.2s;
            border-left: 3px solid #ffd700;
        }

        .player-card:hover {
            background: rgba(255,255,255,0.1);
        }

        .player-name {
            font-weight: bold;
            color: #ffd700;
            font-size: 1em;
            margin-bottom: 8px;
        }

        .player-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 6px;
        }

        .control-group label {
            color: #ccc;
            font-size: 12px;
        }

        .control-group button {
            background: #28a745;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .control-group button.minus {
            background: #dc3545;
        }

        .control-group span {
            color: #00ff00;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
            font-size: 14px;
        }

        .total-value {
            color: #ffd700;
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* Código */
        pre {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 9px;
            max-height: 500px;
            overflow-y: auto;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            margin-top: 15px;
            border: 1px solid #333;
        }

        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
        }

        .status.success {
            background: #28a745;
            color: white;
        }

        .status.error {
            background: #dc3545;
            color: white;
        }

        .status.info {
            background: #17a2b8;
            color: white;
        }

        /* Scrollbar */
        .players-list::-webkit-scrollbar, pre::-webkit-scrollbar {
            width: 6px;
        }

        .players-list::-webkit-scrollbar-track, pre::-webkit-scrollbar-track {
            background: #1a1a2e;
            border-radius: 3px;
        }

        .players-list::-webkit-scrollbar-thumb, pre::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="logo pdq.png" alt="Poker de Quinta" onerror="this.style.display='none'">
            </div>
            <div class="title">POKER DE QUINTA</div>
            <div class="subtitle">Gerador de Código - Atualização de Rebuys e Add-ons</div>
        </div>

        <div class="main-content">
            <!-- Painel de Importação CSV -->
            <div class="card">
                <div class="card-title">
                    📁 IMPORTAR DADOS
                </div>
                
                <div class="csv-area">
                    <textarea id="csvInput" placeholder="Cole os dados do CSV aqui...&#10;&#10;Formato: Nome;Rebuys;Addons;UUID (opcional)&#10;&#10;Exemplo:&#10;Eduardo;8;1;d6a2925b-e405-4532-806a-a2481de59f43&#10;Felipe;3;1;4bddb52c-6a7f-43b9-a4ac-6f7e560c172a"></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn-info" onclick="importCSV()">📥 IMPORTAR CSV</button>
                    <button class="btn-danger" onclick="clearCSV()">🗑️ LIMPAR</button>
                    <button class="btn-success" onclick="fetchFromServer()">🌐 BUSCAR DADOS</button>
                </div>

                <div id="status" class="status"></div>

                <div class="card-title" style="margin-top:20px;">👥 PRÉVIA DOS JOGADORES</div>
                <div id="previewList" class="players-list">
                    <div style="text-align:center; color:#888; padding:40px;">Nenhum dado importado</div>
                </div>
            </div>

            <!-- Painel de Código -->
            <div class="card">
                <div class="card-title">📄 CÓDIGO GERADO</div>
                <div class="btn-group">
                    <button class="btn-primary" onclick="generateFullCode()" id="generateBtn" disabled>🔧 GERAR CÓDIGO</button>
                    <button class="btn-success" onclick="copyCode()" id="copyBtn" disabled>📋 COPIAR</button>
                </div>
                <pre id="codeOutput">Importe um CSV para gerar o código...</pre>
            </div>
        </div>
    </div>

    <script>
        let importedPlayers = [];

        // Configurações do torneio
        const BUYIN_FEE = 100;
        const REBUY_FEE = 30;
        const ADDON_FEE = 50;
        const CHIPS_PER_BUYIN = 15000;
        const CHIPS_PER_ADDON = 50000;
        const ADDON_ROUND = 0;
        const BUYIN_TIME = 1776803009249;
        const REBUY_TIME = 1776803010000;
        const ADDON_TIME = 1776803020000;

        // URL dos dados online
        const ONLINE_DATA_URL = 'https://pokerdequinta.github.io/siteversao2/';

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function displayPreview() {
            const container = document.getElementById('previewList');
            if (importedPlayers.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#888; padding:40px;">Nenhum dado importado</div>';
                return;
            }

            container.innerHTML = importedPlayers.map(p => {
                const totalAmount = BUYIN_FEE + (p.rebuys * REBUY_FEE) + (p.addons * ADDON_FEE);
                return `
                    <div class="player-card">
                        <div class="player-name">${p.nickname}</div>
                        <div class="player-controls">
                            <div class="control-group">
                                <label>🔁 Rebuys (R$${REBUY_FEE}):</label>
                                <button class="minus" onclick="updateRebuys('${p.uuid}', -1)">-</button>
                                <span id="rebuy-${p.uuid}">${p.rebuys}</span>
                                <button onclick="updateRebuys('${p.uuid}', 1)">+</button>
                            </div>
                            <div class="control-group">
                                <label>💰 Add-ons (R$${ADDON_FEE}):</label>
                                <button class="minus" onclick="updateAddons('${p.uuid}', -1)">-</button>
                                <span id="addon-${p.uuid}">${p.addons}</span>
                                <button onclick="updateAddons('${p.uuid}', 1)">+</button>
                            </div>
                            <div class="total-value">
                                💰 TOTAL: R$ ${totalAmount}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateRebuys(uuid, delta) {
            const player = importedPlayers.find(p => p.uuid === uuid);
            if (player) {
                player.rebuys = Math.max(0, player.rebuys + delta);
                displayPreview();
            }
        }

        function updateAddons(uuid, delta) {
            const player = importedPlayers.find(p => p.uuid === uuid);
            if (player) {
                player.addons = Math.max(0, player.addons + delta);
                displayPreview();
            }
        }

        function importCSV() {
            const csvText = document.getElementById('csvInput').value;
            if (!csvText.trim()) {
                showStatus("Por favor, cole os dados do CSV!", "error");
                return;
            }

            const lines = csvText.trim().split(/\r?\n/);
            const players = [];
            let separator = ';';
            if (lines[0] && lines[0].includes(',')) separator = ',';

            for (const line of lines) {
                if (!line.trim()) continue;
                const parts = line.split(separator);
                if (parts.length < 3) continue;
                
                const nickname = parts[0].trim();
                const rebuys = parseInt(parts[1]) || 0;
                const addons = parseInt(parts[2]) || 0;
                let uuid = parts.length > 3 ? parts[3].trim() : null;
                
                if (!uuid || uuid === '') uuid = generateUUID();
                
                if (nickname) {
                    players.push({
                        uuid: uuid,
                        nickname: nickname,
                        rebuys: rebuys,
                        addons: addons,
                        buyinTime: BUYIN_TIME,
                        lastModified: 1776802998912,
                        lastModifiedInfo: 1776802998916
                    });
                }
            }

            if (players.length === 0) {
                showStatus("Nenhum jogador válido encontrado!", "error");
                return;
            }

            importedPlayers = players;
            showStatus(`✅ ${players.length} jogadores importados!`, "success");
            displayPreview();
            
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('copyBtn').disabled = false;
        }

        async function fetchFromServer() {
            showStatus("🌐 Buscando dados online... Aguarde!", "info");
            
            try {
                const response = await fetch(ONLINE_DATA_URL, {
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain' }
                });
                
                if (response.ok) {
                    const data = await response.text();
                    document.getElementById('csvInput').value = data;
                    importCSV();
                    showStatus("✅ Dados importados do servidor!", "success");
                } else {
                    showStatus("⚠️ Erro ao acessar servidor. Verifique a URL.", "error");
                }
            } catch (error) {
                console.error('Erro:', error);
                showStatus("⚠️ Servidor offline. Importe manualmente.", "error");
            }
        }

        function clearCSV() {
            document.getElementById('csvInput').value = '';
            importedPlayers = [];
            document.getElementById('previewList').innerHTML = '<div style="text-align:center; color:#888; padding:40px;">Nenhum dado importado</div>';
            document.getElementById('codeOutput').innerText = 'Importe um CSV para gerar o código...';
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('copyBtn').disabled = true;
            showStatus("Dados limpos!", "success");
        }

        function generateFullCode() {
            if (importedPlayers.length === 0) {
                showStatus("Nenhum jogador importado! Carregue um CSV primeiro.", "error");
                return;
            }

            let playersMapEntries = [];

            importedPlayers.forEach((player) => {
                let buyinsArray = [];
                buyinsArray.push(`new GameBuyin({Time: ${player.buyinTime || BUYIN_TIME}, Round: 1, Amount: ${BUYIN_FEE}, PersonalBounty: 0, Rake: new PerPlayerRake([0]), Chips: ${CHIPS_PER_BUYIN}, Points: 0, ProfileName: "Master"})`);
                
                for (let i = 0; i < player.rebuys; i++) {
                    buyinsArray.push(`new GameBuyin({Time: ${REBUY_TIME}, Round: 1, Amount: ${REBUY_FEE}, PersonalBounty: 0, Rake: new PerPlayerRake([0]), Chips: ${CHIPS_PER_BUYIN}, Points: 0, ProfileName: "Master"})`);
                }

                let addonsArray = [];
                for (let i = 0; i < player.addons; i++) {
                    addonsArray.push(`new GameAddOn({Time: ${ADDON_TIME}, Round: ${ADDON_ROUND}, Amount: ${ADDON_FEE}, Rake: new PerPlayerRake([0]), Chips: ${CHIPS_PER_ADDON}, Points: 0, ProfileName: "Master"})`);
                }

                const totalChips = CHIPS_PER_BUYIN + (player.rebuys * CHIPS_PER_BUYIN) + (player.addons * CHIPS_PER_ADDON);
                const lastModified = player.lastModified || 1776802998912;
                const lastModifiedInfo = player.lastModifiedInfo || 1776802998916;

                const playerEntry = `["${player.uuid}", new GamePlayer({ UUID: "${player.uuid}", Name: new PlayerName({UUID: "${player.uuid}", Nickname: "${player.nickname}", Firstname: "", Lastname: "", LastModified: ${lastModified}}), Info: new PlayerInfo({UUID: "${player.uuid}", StreetAddress: "", City: "", State: "", Zipcode: "", Country: "", Phone1: "", Phone2: "", Email1: "", Email2: "", Notes: "", LastModified: ${lastModifiedInfo}, OptID: ""}), Buyins: [${buyinsArray.join(', ')}], AddOns: [${addonsArray.join(', ')}], CashAdjustment: 0, PointsAdjustment: 0, ChipCount: ${totalChips}, NumberOfTableMoves: 1, PaidInFull: true, HitsAdjustment: 0 })]`;
                
                playersMapEntries.push(playerEntry);
            });

            const seatsArray = importedPlayers.map(p => `"${p.uuid}"`).join(', ');
            const locksArray = Array(importedPlayers.length).fill('false').join(', ');
