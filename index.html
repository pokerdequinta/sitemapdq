<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Rebuys e Add-ons - Poker Tournament</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #0e2a1a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            text-align: center;
            color: #ccc;
            margin-bottom: 30px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Painel de Jogadores */
        .players-panel {
            background: rgba(0,0,0,0.85);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #ffd700;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .panel-title {
            font-size: 1.5em;
            color: #ffd700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ffd700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-player-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s;
        }

        .add-player-btn:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .players-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .player-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #ffd700;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .player-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #ffd700;
        }

        .remove-player {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
        }

        .player-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 10px;
        }

        .stat-control {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat-label {
            color: #ccc;
            font-size: 0.9em;
            min-width: 70px;
        }

        .stat-value {
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
        }

        .stat-btn {
            background: #ffc107;
            color: #000;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .stat-btn:hover {
            background: #ffca2c;
            transform: scale(1.05);
        }

        .stat-btn.minus {
            background: #dc3545;
            color: white;
        }

        .stat-btn.minus:hover {
            background: #c82333;
        }

        .chips-info {
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            color: #00ff00;
        }

        /* Painel de Configurações */
        .config-panel {
            background: rgba(0,0,0,0.85);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #ffd700;
        }

        .tournament-config {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        .config-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .config-field {
            flex: 1;
        }

        .config-field label {
            display: block;
            color: #ffd700;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .config-field input {
            width: 100%;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #ffd700;
            border-radius: 5px;
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #ffd700;
            color: #000;
        }

        .btn-primary:hover {
            background: #ffed4a;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #ffc107;
            color: #000;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .json-output {
            margin-top: 20px;
            background: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #333;
        }

        .json-output h3 {
            color: #ffd700;
            margin-bottom: 10px;
        }

        pre {
            background: #0d0d0d;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.8em;
            color: #00ff00;
            max-height: 300px;
            overflow-y: auto;
        }

        .copy-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 GERENCIADOR DE REBUYS E ADD-ONS 🎰</h1>
        <div class="subtitle">Configure os jogadores e gere o código atualizado para importar no software de torneio</div>

        <div class="main-content">
            <!-- Painel de Jogadores -->
            <div class="players-panel">
                <div class="panel-title">
                    <span>👥 JOGADORES</span>
                    <button class="add-player-btn" onclick="addPlayer()">+ Novo Jogador</button>
                </div>
                <div id="playersList" class="players-list"></div>
            </div>

            <!-- Painel de Configuração -->
            <div class="config-panel">
                <div class="panel-title">⚙️ CONFIGURAÇÕES DO TORNEIO</div>
                
                <div class="tournament-config">
                    <div class="config-row">
                        <div class="config-field">
                            <label>Nome do Torneio</label>
                            <input type="text" id="tournamentTitle" value="POKER DE QUARTA">
                        </div>
                        <div class="config-field">
                            <label>Valor Buy-in (R$)</label>
                            <input type="number" id="buyinAmount" value="100">
                        </div>
                    </div>
                    <div class="config-row">
                        <div class="config-field">
                            <label>Valor Rebuy (R$)</label>
                            <input type="number" id="rebuyAmount" value="20">
                        </div>
                        <div class="config-field">
                            <label>Valor Add-on (R$)</label>
                            <input type="number" id="addonAmount" value="50">
                        </div>
                    </div>
                    <div class="config-row">
                        <div class="config-field">
                            <label>Chips por Buy-in/Rebuy</label>
                            <input type="number" id="chipsPerBuyin" value="15000">
                        </div>
                        <div class="config-field">
                            <label>Chips por Add-on</label>
                            <input type="number" id="chipsPerAddon" value="50000">
                        </div>
                    </div>
                    <div class="config-row">
                        <div class="config-field">
                            <label>Round do Add-on</label>
                            <input type="number" id="addonRound" value="10">
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="generateJSON()">🔧 GERAR CÓDIGO ATUALIZADO</button>
                    <button class="btn btn-success" onclick="downloadJSONFile()">💾 BAIXAR JSON</button>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-warning" onclick="loadSampleData()">📋 CARREGAR EXEMPLO</button>
                    <button class="btn btn-danger" onclick="clearAllPlayers()">🗑️ LIMPAR TODOS</button>
                </div>

                <div class="json-output">
                    <h3>📄 CÓDIGO JSON PARA IMPORTAR:</h3>
                    <pre id="jsonOutput">Clique em "GERAR CÓDIGO" para visualizar...</pre>
                    <button class="copy-btn" onclick="copyToClipboard()">📋 Copiar código</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let players = [];

        // Configurações do torneio
        let tournamentSettings = {
            uuid: "1806768e-837c-485a-8e96-f1a12a5286d0",
            title: "POKER DE QUARTA",
            tableUUID: "dfc69d93-a845-4e62-8fe2-0b058ff7e144"
        };

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function addPlayer() {
            const newUUID = generateUUID();
            players.push({
                uuid: newUUID,
                nickname: `Jogador ${players.length + 1}`,
                buyins: 1,
                rebuys: 0,
                addons: 0,
                seatIndex: players.length,
                chipCount: 15000
            });
            renderPlayers();
        }

        function removePlayer(index) {
            players.splice(index, 1);
            renderPlayers();
        }

        function updateRebuys(index, delta) {
            const newValue = players[index].rebuys + delta;
            if (newValue >= 0) {
                players[index].rebuys = newValue;
                updateChipCount(index);
            }
            renderPlayers();
        }

        function updateAddons(index, delta) {
            const newValue = players[index].addons + delta;
            if (newValue >= 0) {
                players[index].addons = newValue;
                updateChipCount(index);
            }
            renderPlayers();
        }

        function updatePlayerName(index, newName) {
            players[index].nickname = newName;
            renderPlayers();
        }

        function updateChipCount(index) {
            const buyinChips = parseInt(document.getElementById('chipsPerBuyin').value);
            const addonChips = parseInt(document.getElementById('chipsPerAddon').value);
            const totalRebuys = players[index].rebuys;
            const totalAddons = players[index].addons;
            
            players[index].chipCount = buyinChips + (totalRebuys * buyinChips) + (totalAddons * addonChips);
        }

        function recalcAllChips() {
            players.forEach((_, idx) => updateChipCount(idx));
        }

        function renderPlayers() {
            const container = document.getElementById('playersList');
            if (!players.length) {
                container.innerHTML = '<div style="text-align:center; color:#888; padding:40px;">Nenhum jogador cadastrado.<br>Clique em "+ Novo Jogador" para começar.</div>';
                return;
            }

            container.innerHTML = players.map((player, idx) => `
                <div class="player-card">
                    <div class="player-header">
                        <input type="text" class="player-name" value="${player.nickname}" 
                               style="background:transparent; border:1px solid #ffd700; color:#ffd700; padding:5px; border-radius:5px;"
                               onchange="updatePlayerName(${idx}, this.value)">
                        <button class="remove-player" onclick="removePlayer(${idx})">✖ Remover</button>
                    </div>
                    <div class="player-stats">
                        <div class="stat-control">
                            <span class="stat-label">🎯 Rebuys:</span>
                            <button class="stat-btn minus" onclick="updateRebuys(${idx}, -1)">-</button>
                            <span class="stat-value">${player.rebuys}</span>
                            <button class="stat-btn" onclick="updateRebuys(${idx}, 1)">+</button>
                        </div>
                        <div class="stat-control">
                            <span class="stat-label">💰 Add-ons:</span>
                            <button class="stat-btn minus" onclick="updateAddons(${idx}, -1)">-</button>
                            <span class="stat-value">${player.addons}</span>
                            <button class="stat-btn" onclick="updateAddons(${idx}, 1)">+</button>
                        </div>
                    </div>
                    <div class="chips-info">
                        💎 Fichas totais: ${player.chipCount.toLocaleString()} | 
                        Buy-in: 1 | Rebuys: ${player.rebuys} | Add-ons: ${player.addons}
                    </div>
                </div>
            `).join('');
        }

        function generateJSON() {
            const buyinAmount = parseInt(document.getElementById('buyinAmount').value);
            const rebuyAmount = parseInt(document.getElementById('rebuyAmount').value);
            const addonAmount = parseInt(document.getElementById('addonAmount').value);
            const chipsPerBuyin = parseInt(document.getElementById('chipsPerBuyin').value);
            const chipsPerAddon = parseInt(document.getElementById('chipsPerAddon').value);
            const addonRound = parseInt(document.getElementById('addonRound').value);
            const tournamentTitle = document.getElementById('tournamentTitle').value;

            recalcAllChips();

            const playersJSON = {};
            const timestamp = Date.now();

            players.forEach((player, idx) => {
                const buyins = [];
                // Buy-in inicial
                buyins.push({
                    Time: timestamp - 100000 + idx,
                    Round: 1,
                    Amount: buyinAmount,
                    PersonalBounty: 0,
                    Rake: { "0": 0 },
                    Chips: chipsPerBuyin,
                    Points: 0,
                    ProfileName: "Master",
                    Seat: {
                        TableName: "MESA 1",
                        SeatIndex: player.seatIndex,
                        Locked: false,
                        TableUUID: tournamentSettings.tableUUID
                    }
                });

                // Rebuys
                for (let i = 0; i < player.rebuys; i++) {
                    buyins.push({
                        Time: timestamp - 50000 + i * 1000,
                        Round: 1,
                        Amount: rebuyAmount,
                        PersonalBounty: 0,
                        Rake: { "0": 0 },
                        Chips: chipsPerBuyin,
                        Points: 0,
                        ProfileName: "Master",
                        Seat: {
                            TableName: "MESA 1",
                            SeatIndex: player.seatIndex,
                            Locked: false,
                            TableUUID: tournamentSettings.tableUUID
                        }
                    });
                }

                const addons = [];
                for (let i = 0; i < player.addons; i++) {
                    addons.push({
                        Time: timestamp + 10000 + i * 1000,
                        Round: addonRound,
                        Amount: addonAmount,
                        Rake: { "0": 0 },
                        Chips: chipsPerAddon,
                        Points: 0,
                        ProfileName: "Master"
                    });
                }

                playersJSON[player.uuid] = {
                    UUID: player.uuid,
                    Name: {
                        UUID: player.uuid,
                        Nickname: player.nickname,
                        Firstname: "",
                        Lastname: "",
                        LastModified: timestamp
                    },
                    Info: {
                        UUID: player.uuid,
                        StreetAddress: "",
                        City: "",
                        State: "",
                        Zipcode: "",
                        Country: "",
                        Phone1: "",
                        Phone2: "",
                        Email1: "",
                        Email2: "",
                        Notes: "",
                        LastModified: timestamp,
                        OptID: "",
                        ImageRot: 0
                    },
                    Buyins: buyins,
                    AddOns: addons,
                    CashAdjustment: 0,
                    PointsAdjustment: 0,
                    ChipCount: player.chipCount,
                    NumberOfTableMoves: 1,
                    PaidInFull: true,
                    HitsAdjustment: 0
                };
            });

            const finalJSON = {
                V: "3.7.2",
                T: {
                    UUID: tournamentSettings.uuid,
                    Title: tournamentTitle,
                    Description: "",
                    Notes: "",
                    Financials: {
                        Buyins: {
                            Allow: false,
                            Profiles: [{
                                Name: "Master",
                                Enabled: true,
                                AllowChange: true,
                                Fee: buyinAmount,
                                Rake: { "0": 0 },
                                Chips: chipsPerBuyin,
                                Points: 0,
                                BountyChipCost: 0
                            }],
                            DefIndex: 0,
                            LastRound: 0,
                            MaxPerPlayer: 0,
                            MaxTotal: 0,
                            MinPlayers: 0
                        },
                        AddOns: {
                            Allow: true,
                            Profiles: [{
                                Name: "Master",
                                Enabled: true,
                                AllowChange: true,
                                Fee: addonAmount,
                                Rake: { "0": 0 },
                                Chips: chipsPerAddon,
                                Points: 0,
                                BountyChipCost: 0
                            }],
                            DefIndex: 0,
                            LastRound: addonRound,
                            MaxPerPlayer: 0,
                            MaxTotal: 0,
                            MinPlayers: 0
                        },
                        Rebuys: {
                            Allow: true,
                            Profiles: [{
                                Name: "Master",
                                Enabled: true,
                                AllowChange: true,
                                Fee: rebuyAmount,
                                Rake: { "0": 0 },
                                Chips: chipsPerBuyin,
                                Points: 0,
                                BountyChipCost: 0
                            }],
                            DefIndex: 0,
                            LastRound: 10,
                            MaxPerPlayer: 0,
                            MaxTotal: 0,
                            MinPlayers: 0
                        }
                    },
                    Players: playersJSON
                }
            };

            document.getElementById('jsonOutput').innerHTML = JSON.stringify(finalJSON, null, 2);
        }

        function downloadJSONFile() {
            const jsonStr = document.getElementById('jsonOutput').innerText;
            if (jsonStr === 'Clique em "GERAR CÓDIGO" para visualizar...') {
                alert('Por favor, gere o código primeiro clicando em "GERAR CÓDIGO"');
                return;
            }
            
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tournament_data.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function copyToClipboard() {
            const jsonText = document.getElementById('jsonOutput').innerText;
            navigator.clipboard.writeText(jsonText).then(() => {
                alert('Código copiado para a área de transferência!');
            });
        }

        function loadSampleData() {
            players = [
                { uuid: generateUUID(), nickname: "Eduardo", buyins: 1, rebuys: 8, addons: 1, seatIndex: 3, chipCount: 185000 },
                { uuid: generateUUID(), nickname: "Felipe", buyins: 1, rebuys: 3, addons: 1, seatIndex: 7, chipCount: 110000 },
                { uuid: generateUUID(), nickname: "Julinho", buyins: 1, rebuys: 4, addons: 1, seatIndex: 9, chipCount: 125000 },
                { uuid: generateUUID(), nickname: "Leno", buyins: 1, rebuys: 0, addons: 1, seatIndex: 4, chipCount: 65000 },
                { uuid: generateUUID(), nickname: "Long", buyins: 1, rebuys: 0, addons: 1, seatIndex: 5, chipCount: 65000 },
                { uuid: generateUUID(), nickname: "Matheus", buyins: 1, rebuys: 0, addons: 1, seatIndex: 1, chipCount: 65000 },
                { uuid: generateUUID(), nickname: "Ricardo", buyins: 1, rebuys: 0, addons: 1, seatIndex: 10, chipCount: 65000 },
                { uuid: generateUUID(), nickname: "Roberto", buyins: 1, rebuys: 0, addons: 1, seatIndex: 6, chipCount: 65000 },
                { uuid: generateUUID(), nickname: "Sergio", buyins: 1, rebuys: 0, addons: 1, seatIndex: 8, chipCount: 65000 },
                { uuid: generateUUID(), nickname: "Tigre", buyins: 1, rebuys: 0, addons: 1, seatIndex: 0, chipCount: 65000 }
            ];
            renderPlayers();
            generateJSON();
        }

        function clearAllPlayers() {
            if (confirm('Tem certeza que deseja remover todos os jogadores?')) {
                players = [];
                renderPlayers();
                document.getElementById('jsonOutput').innerHTML = 'Clique em "GERAR CÓDIGO" para visualizar...';
            }
        }

        // Inicializar com dados de exemplo
        loadSampleData();
    </script>
</body>
</html>
