<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Torneio Poker - Rebuys e Add-ons</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background: #1a1a2e;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 20px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
        }

        /* Painel de Jogadores */
        .players-panel {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #ffd700;
        }

        .panel-title {
            color: #ffd700;
            font-size: 1.2em;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-player {
            background: #00b894;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .players-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .player-item {
            background: #0f3460;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }

        .player-name {
            background: transparent;
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 3px 5px;
            width: 120px;
            margin-right: 10px;
        }

        .player-stats {
            display: flex;
            gap: 15px;
            margin-top: 8px;
            font-size: 12px;
        }

        .stat-control {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-btn {
            background: #e74c3c;
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 3px;
            cursor: pointer;
        }

        .stat-btn.plus {
            background: #27ae60;
        }

        .remove-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            float: right;
        }

        /* Painel de Código */
        .code-panel {
            background: #0d1117;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #ffd700;
        }

        .config-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .config-field {
            flex: 1;
        }

        .config-field label {
            display: block;
            color: #ffd700;
            font-size: 12px;
            margin-bottom: 3px;
        }

        .config-field input {
            width: 100%;
            padding: 5px;
            background: #1a1a2e;
            border: 1px solid #ffd700;
            color: white;
            border-radius: 3px;
        }

        .btn {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }

        .btn-copy {
            background: #00b894;
            color: white;
        }

        pre {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 10px;
            max-height: 600px;
            overflow-y: auto;
            color: #00ff00;
        }

        .actions {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 GERADOR DE CÓDIGO - REBUYS E ADD-ONS 🎰</h1>
        
        <div class="main-content">
            <div class="players-panel">
                <div class="panel-title">
                    JOGADORES
                    <button class="add-player" onclick="addPlayer()">+ NOVO</button>
                </div>
                <div id="playersList" class="players-list"></div>
            </div>

            <div class="code-panel">
                <div class="config-row">
                    <div class="config-field">
                        <label>Nome do Torneio</label>
                        <input type="text" id="tourneyTitle" value="POKER DE QUARTA">
                    </div>
                    <div class="config-field">
                        <label>Fee Buy-in (R$)</label>
                        <input type="number" id="buyinFee" value="100">
                    </div>
                </div>
                <div class="config-row">
                    <div class="config-field">
                        <label>Fee Rebuy (R$)</label>
                        <input type="number" id="rebuyFee" value="20">
                    </div>
                    <div class="config-field">
                        <label>Fee Add-on (R$)</label>
                        <input type="number" id="addonFee" value="50">
                    </div>
                </div>
                <div class="config-row">
                    <div class="config-field">
                        <label>Chips por Buy-in/Rebuy</label>
                        <input type="number" id="chipsPerBuyin" value="15000">
                    </div>
                    <div class="config-field">
                        <label>Chips por Add-on</label>
                        <input type="number" id="chipsPerAddon" value="50000">
                    </div>
                </div>
                
                <div class="actions">
                    <button class="btn" onclick="generateCode()">🔧 GERAR CÓDIGO</button>
                    <button class="btn btn-copy" onclick="copyCode()">📋 COPIAR</button>
                    <button class="btn" onclick="loadSample()">📋 CARREGAR EXEMPLO</button>
                </div>

                <pre id="codeOutput">Clique em "GERAR CÓDIGO" para visualizar...</pre>
            </div>
        </div>
    </div>

    <script>
        let players = [];

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function addPlayer() {
            players.push({
                uuid: generateUUID(),
                nickname: `Jogador${players.length + 1}`,
                rebuys: 0,
                addons: 0,
                seatIndex: players.length
            });
            renderPlayers();
        }

        function removePlayer(index) {
            players.splice(index, 1);
            renderPlayers();
        }

        function updateRebuys(index, delta) {
            players[index].rebuys = Math.max(0, players[index].rebuys + delta);
            renderPlayers();
        }

        function updateAddons(index, delta) {
            players[index].addons = Math.max(0, players[index].addons + delta);
            renderPlayers();
        }

        function updatePlayerName(index, name) {
            players[index].nickname = name;
            renderPlayers();
        }

        function renderPlayers() {
            const container = document.getElementById('playersList');
            if (players.length === 0) {
                container.innerHTML = '<div style="color:#888; text-align:center; padding:20px;">Nenhum jogador<br>Clique em "+ NOVO"</div>';
                return;
            }

            container.innerHTML = players.map((p, idx) => `
                <div class="player-item">
                    <button class="remove-btn" onclick="removePlayer(${idx})">✖</button>
                    <input type="text" class="player-name" value="${p.nickname}" 
                           onchange="updatePlayerName(${idx}, this.value)">
                    <div class="player-stats">
                        <div class="stat-control">
                            <span>Rebuys:</span>
                            <button class="stat-btn" onclick="updateRebuys(${idx}, -1)">-</button>
                            <span style="min-width:25px">${p.rebuys}</span>
                            <button class="stat-btn plus" onclick="updateRebuys(${idx}, 1)">+</button>
                        </div>
                        <div class="stat-control">
                            <span>Add-ons:</span>
                            <button class="stat-btn" onclick="updateAddons(${idx}, -1)">-</button>
                            <span style="min-width:25px">${p.addons}</span>
                            <button class="stat-btn plus" onclick="updateAddons(${idx}, 1)">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function generateCode() {
            const tourneyTitle = document.getElementById('tourneyTitle').value;
            const buyinFee = parseInt(document.getElementById('buyinFee').value);
            const rebuyFee = parseInt(document.getElementById('rebuyFee').value);
            const addonFee = parseInt(document.getElementById('addonFee').value);
            const chipsPerBuyin = parseInt(document.getElementById('chipsPerBuyin').value);
            const chipsPerAddon = parseInt(document.getElementById('chipsPerAddon').value);
            
            const baseTime = 1777071314333;
            const rebuyTime = 1777071445221;

                // Construir o array de Buyins (1 buy-in + N rebuys)
                let buyinsArray = [];
                
                // Buy-in inicial
                buyinsArray.push(`new GameBuyin({Time: ${baseTime}, Round: 1, Amount: ${buyinFee}, PersonalBounty: 0, Rake: new PerPlayerRake([0]), Chips: ${chipsPerBuyin}, Points: 0, ProfileName: "Master", Seat: new GameSeat({TableName: "MESA 1", SeatIndex: ${seatIdx}, Locked: false, TableUUID: "dfc69d93-a845-4e62-8fe2-0b058ff7e144"})})`);
                
                // Rebuys
                for (let i = 0; i < player.rebuys; i++) {
                    buyinsArray.push(`new GameBuyin({Time: ${rebuyTime}, Round: 1, Amount: ${rebuyFee}, PersonalBounty: 0, Rake: new PerPlayerRake([0]), Chips: ${chipsPerBuyin}, Points: 0, ProfileName: "Master", Seat: new GameSeat({TableName: "MESA 1", SeatIndex: ${seatIdx}, Locked: false, TableUUID: "dfc69d93-a845-4e62-8fe2-0b058ff7e144"})})`);
                }
                
                // Construir o array de AddOns
                let addonsArray = [];
                for (let i = 0; i < player.addons; i++) {
                    addonsArray.push(`new GameAddOn({Time: ${addonTime}, Round: 10, Amount: ${addonFee}, Rake: new PerPlayerRake([0]), Chips: ${chipsPerAddon}, Points: 0, ProfileName: "Master"})`);
                }
                
                // Calcular ChipCount
                const chipCount = chipsPerBuyin + (player.rebuys * chipsPerBuyin) + (player.addons * chipsPerAddon);
