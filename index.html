<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Poker de Quinta - Sistema de Gerenciamento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
        }

        /* Layout principal */
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Painel Administrativo */
        .admin-panel {
            width: 450px;
            background: #0f0f1a;
            border-right: 2px solid #2c2c3e;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            gap: 20px;
        }

        /* Tela da TV */
        .tv-screen {
            flex: 1;
            background: #0a0a0f;
            overflow-y: auto;
            padding: 30px;
            position: relative;
        }

        /* Cards */
        .card {
            background: #1e1e2e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card h3 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-left: 3px solid #ffd700;
            padding-left: 10px;
        }

        /* Formulários */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 0.9em;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: #2a2a3a;
            border: 1px solid #3a3a4a;
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ffd700;
        }

        button {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        button:hover {
            background: #ffed4a;
            transform: translateY(-1px);
        }

        button.danger {
            background: #dc3545;
            color: white;
        }

        button.danger:hover {
            background: #c82333;
        }

        button.success {
            background: #28a745;
            color: white;
        }

        /* Tabela de jogadores */
        .players-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .player-item {
            background: #2a2a3a;
            margin: 8px 0;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-weight: bold;
        }

        .player-stats {
            font-size: 0.85em;
            color: #ffd700;
        }

        .player-actions button {
            margin-left: 5px;
            padding: 5px 10px;
            font-size: 0.8em;
        }

        /* Mesas */
        .tables-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .table {
            background: #1a1a2e;
            border-radius: 50%;
            width: 400px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .table.preta {
            background: #2d2d2d;
            border: 3px solid #555;
        }

        .table.amarela {
            background: #4a3a1a;
            border: 3px solid #ffd700;
        }

        .table h4 {
            color: #ffd700;
            margin-bottom: 15px;
        }

        .seats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .seat {
            background: #2a2a3a;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .seat.occupied {
            background: #3a6a3a;
            color: #ffd700;
        }

        .seat:hover {
            transform: scale(1.05);
            background: #3a3a5a;
        }

        /* Estatísticas da TV */
        .tv-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1e1e2e, #2a2a3a);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-label {
            color: #aaa;
            margin-top: 10px;
        }

        .prize-pool {
            background: linear-gradient(135deg, #2a2a3a, #1a1a2e);
            border: 2px solid #ffd700;
        }

        /* Tabela de premiação */
        .prize-table {
            margin-top: 20px;
        }

        .prize-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #2a2a3a;
        }

        /* Cronômetro */
        .timer {
            text-align: center;
            font-size: 3em;
            font-family: monospace;
            background: #0a0a0f;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        /* Responsividade */
        @media (max-width: 1024px) {
            .admin-panel {
                width: 350px;
            }
            .table {
                width: 300px;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            .admin-panel {
                width: 100%;
                max-height: 50vh;
            }
            .tv-screen {
                max-height: 50vh;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Painel Administrativo -->
    <div class="admin-panel">
        <h2>🎰 Painel de Controle</h2>
        
        <!-- Configurações do Torneio -->
        <div class="card">
            <h3>⚙️ Configurações</h3>
            <div class="form-group">
                <label>Buy-in (R$)</label>
                <input type="number" id="buyinValue" value="50" step="10">
            </div>
            <div class="form-group">
                <label>Rebuy (R$)</label>
                <input type="number" id="rebuyValue" value="50" step="10">
            </div>
            <div class="form-group">
                <label>Add-on (R$)</label>
                <input type="number" id="addonValue" value="30" step="10">
            </div>
            <div class="form-group">
                <label>Fichas Iniciais</label>
                <input type="number" id="initialChips" value="10000" step="1000">
            </div>
            <div class="form-group">
                <label>Taxa da Organização (%)</label>
                <input type="number" id="orgFee" value="10" step="5">
            </div>
            <button onclick="updateConfig()" class="success">💾 Salvar Configurações</button>
        </div>

        <!-- Gerenciamento de Jogadores -->
        <div class="card">
            <h3>👥 Jogadores</h3>
            <div class="form-group">
                <input type="text" id="playerName" placeholder="Nome do jogador">
            </div>
            <button onclick="addPlayer()">➕ Adicionar Jogador</button>
            <div class="players-list" id="playersList"></div>
        </div>

        <!-- Ações do Dealer -->
        <div class="card">
            <h3>🃏 Caderno do Dealer</h3>
            <div class="form-group">
                <select id="dealerPlayer">
                    <option value="">Selecione o jogador</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="addRebuy()">🔄 Rebuy</button>
                <button onclick="addAddon()">➕ Add-on</button>
            </div>
        </div>

        <!-- Controle de Mesas -->
        <div class="card">
            <h3>🎲 Distribuição de Mesas</h3>
            <button onclick="randomizeSeats()">🔄 Sortear Posições Aleatórias</button>
            <button onclick="exportSeats()">📄 Exportar Posições</button>
        </div>

        <!-- Exportação -->
        <div class="card">
            <h3>📊 Relatórios</h3>
            <button onclick="exportExpenses()">📥 Exportar Gastos (CSV)</button>
            <button onclick="resetTournament()" class="danger">🔄 Resetar Torneio</button>
        </div>
    </div>

    <!-- Tela da TV -->
    <div class="tv-screen">
        <div class="timer" id="timerDisplay">00:00:00</div>
        
        <div class="tv-stats">
            <div class="stat-card">
                <div class="stat-value" id="totalPot">R$ 0</div>
                <div class="stat-label">Pote Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgChips">0</div>
                <div class="stat-label">Média de Fichas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalPlayers">0</div>
                <div class="stat-label">Jogadores</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalRebuys">0</div>
                <div class="stat-label">Rebuys</div>
            </div>
        </div>

        <!-- Premiação -->
        <div class="card prize-pool">
            <h3>🏆 Premiação Estimada</h3>
            <div id="prizeDistribution"></div>
        </div>

        <!-- Mesas -->
        <div class="tables-container" id="tablesContainer"></div>

        <!-- Lista de Jogadores e Fichas -->
        <div class="card">
            <h3>📋 Detalhamento dos Jogadores</h3>
            <div id="tvPlayersList"></div>
        </div>
    </div>
</div>

<script>
    // Estrutura de dados
    let players = [];
    let seats = {
        preta: Array(10).fill(null),
        amarela: Array(10).fill(null)
    };
    let config = {
        buyin: 50,
        rebuy: 50,
        addon: 30,
        initialChips: 10000,
        orgFee: 10
    };
    let timerInterval = null;
    let timerSeconds = 0;

    // Inicialização
    function init() {
        loadFromStorage();
        updateAllDisplays();
        startTimer();
        setInterval(updateAllDisplays, 1000);
    }

    // Persistência local
    function saveToStorage() {
        const data = {
            players,
            seats,
            config,
            timerSeconds
        };
        localStorage.setItem('pokerManager', JSON.stringify(data));
    }

    function loadFromStorage() {
        const saved = localStorage.getItem('pokerManager');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                players = data.players || [];
                seats = data.seats || { preta: Array(10).fill(null), amarela: Array(10).fill(null) };
                config = data.config || config;
                timerSeconds = data.timerSeconds || 0;
            } catch(e) { console.error(e); }
        }
        
        // Sincronizar inputs
        document.getElementById('buyinValue').value = config.buyin;
        document.getElementById('rebuyValue').value = config.rebuy;
        document.getElementById('addonValue').value = config.addon;
        document.getElementById('initialChips').value = config.initialChips;
        document.getElementById('orgFee').value = config.orgFee;
    }

    // Atualizar configurações
    function updateConfig() {
        config.buyin = parseFloat(document.getElementById('buyinValue').value) || 0;
        config.rebuy = parseFloat(document.getElementById('rebuyValue').value) || 0;
        config.addon = parseFloat(document.getElementById('addonValue').value) || 0;
        config.initialChips = parseInt(document.getElementById('initialChips').value) || 0;
        config.orgFee = parseFloat(document.getElementById('orgFee').value) || 0;
        saveToStorage();
        updateAllDisplays();
        alert('Configurações salvas!');
    }

    // Adicionar jogador
    function addPlayer() {
        const name = document.getElementById('playerName').value.trim();
        if (!name) {
            alert('Digite o nome do jogador');
            return;
        }
        
        if (players.find(p => p.name === name)) {
            alert('Jogador já existe!');
            return;
        }
        
        players.push({
            id: Date.now(),
            name: name,
            buyin: true,
            rebuys: 0,
            addons: 0,
            chips: config.initialChips,
            totalPaid: config.buyin
        });
        
        document.getElementById('playerName').value = '';
        saveToStorage();
        updateAllDisplays();
    }

    // Adicionar Rebuy
    function addRebuy() {
        const select = document.getElementById('dealerPlayer');
        const playerId = parseInt(select.value);
        const player = players.find(p => p.id === playerId);
        if (!player) {
            alert('Selecione um jogador');
            return;
        }
        
        player.rebuys++;
        player.totalPaid += config.rebuy;
        player.chips += config.initialChips;
        saveToStorage();
        updateAllDisplays();
    }

    // Adicionar Add-on
    function addAddon() {
        const select = document.getElementById('dealerPlayer');
        const playerId = parseInt(select.value);
        const player = players.find(p => p.id === playerId);
        if (!player) {
            alert('Selecione um jogador');
            return;
        }
        
        player.addons++;
        player.totalPaid += config.addon;
        player.chips += config.initialChips;
        saveToStorage();
        updateAllDisplays();
    }

    // Sortear posições
    function randomizeSeats() {
        // Resetar mesas
        seats = {
            preta: Array(10).fill(null),
            amarela: Array(10).fill(null)
        };
        
        const activePlayers = [...players];
        // Embaralhar
        for (let i = activePlayers.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [activePlayers[i], activePlayers[j]] = [activePlayers[j], activePlayers[i]];
        }
        
        let pretaIndex = 0, amarelaIndex = 0;
        activePlayers.forEach(player => {
            if (pretaIndex < 10 && (amarelaIndex >= 10 || Math.random() < 0.5)) {
                seats.preta[pretaIndex++] = player.id;
            } else if (amarelaIndex < 10) {
                seats.amarela[amarelaIndex++] = player.id;
            } else if (pretaIndex < 10) {
                seats.preta[pretaIndex++] = player.id;
            }
        });
        
        saveToStorage();
        updateAllDisplays();
    }

    // Mover jogador entre mesas/posições
    function movePlayer(table, seatIndex, playerId) {
        // Remover de todas as posições
        for (let t in seats) {
            const idx = seats[t].indexOf(playerId);
            if (idx !== -1) seats[t][idx] = null;
        }
        seats[table][seatIndex] = playerId;
        saveToStorage();
        updateAllDisplays();
    }

    // Cálculo do pote
    function calculatePot() {
        let totalPaid = players.reduce((sum, p) => sum + p.totalPaid, 0);
        const fee = (totalPaid * config.orgFee) / 100;
        return totalPaid - fee;
    }

    // Média de fichas
    function averageChips() {
        if (players.length === 0) return 0;
        const total = players.reduce((sum, p) => sum + p.chips, 0);
        return Math.floor(total / players.length);
    }

    // Distribuição de prêmios (top 3)
    function getPrizeDistribution() {
        const pot = calculatePot();
        if (pot <= 0) return [];
        return [
            { pos: 1, percent: 50, value: pot * 0.5 },
            { pos: 2, percent: 30, value: pot * 0.3 },
            { pos: 3, percent: 20, value: pot * 0.2 }
        ];
    }

    // Atualizar todas as interfaces
    function updateAllDisplays() {
        updateAdminPanel();
        updateTVScreen();
        saveToStorage();
    }

    function updateAdminPanel() {
        // Atualizar lista de jogadores
        const playersDiv = document.getElementById('playersList');
        playersDiv.innerHTML = players.map(p => `
            <div class="player-item">
                <div>
                    <div class="player-name">${p.name}</div>
                    <div class="player-stats">💰 R$ ${p.totalPaid} | 🎴 ${p.chips} fichas | 🔄 ${p.rebuys} | ➕ ${p.addons}</div>
                </div>
                <div class="player-actions">
                    <button onclick="removePlayer(${p.id})" class="danger">❌</button>
                </div>
            </div>
        `).join('');
        
        // Atualizar select do dealer
        const dealerSelect = document.getElementById('dealerPlayer');
        dealerSelect.innerHTML = '<option value="">Selecione o jogador</option>' + 
            players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    function updateTVScreen() {
        // Estatísticas principais
        const totalPot = calculatePot();
        document.getElementById('totalPot').innerHTML = `R$ ${totalPot.toFixed(2)}`;
        document.getElementById('avgChips').innerHTML = averageChips().toLocaleString();
        document.getElementById('totalPlayers').innerHTML = players.length;
        document.getElementById('totalRebuys').innerHTML = players.reduce((sum, p) => sum + p.rebuys, 0);
        
        // Premiação
        const prizes = getPrizeDistribution();
        const prizeDiv = document.getElementById('prizeDistribution');
        prizeDiv.innerHTML = prizes.map(p => `
            <div class="prize-row">
                <span>🥇 ${p.pos}º Lugar (${p.percent}%)</span>
                <span style="color:#ffd700; font-weight:bold;">R$ ${p.value.toFixed(2)}</span>
            </div>
        `).join('');
        
        // Mesas
        const tablesContainer = document.getElementById('tablesContainer');
        tablesContainer.innerHTML = `
            <div class="table preta">
                <h4>🖤 Mesa Preta</h4>
                <div class="seats">
                    ${seats.preta.map((playerId, idx) => {
                        const player = players.find(p => p.id === playerId);
                        return `<div class="seat ${player ? 'occupied' : ''}" onclick="movePlayerPrompt('preta', ${idx})">
                            ${player ? player.name : `Cadeira ${idx+1}`}
                        </div>`;
                    }).join('')}
                </div>
            </div>
            <div class="table amarela">
                <h4>💛 Mesa Amarela</h4>
                <div class="seats">
                    ${seats.amarela.map((playerId, idx) => {
                        const player = players.find(p => p.id === playerId);
                        return `<div class="seat ${player ? 'occupied' : ''}" onclick="movePlayerPrompt('amarela', ${idx})">
                            ${player ? player.name : `Cadeira ${idx+1}`}
                        </div>`;
                    }).join('')}
                </div>
            </div>
        `;
        
        // Lista detalhada dos jogadores para TV
        const tvPlayersDiv = document.getElementById('tvPlayersList');
        tvPlayersDiv.innerHTML = players.map(p => `
            <div class="player-item">
                <div>
                    <div class="player-name">${p.name}</div>
                    <div class="player-stats">🎴 ${p.chips.toLocaleString()} fichas | 🔄 ${p.rebuys} | ➕ ${p.addons} | 💰 R$ ${p.totalPaid}</div>
                </div>
            </div>
        `).join('');
    }

    function movePlayerPrompt(table, seatIndex) {
        const currentPlayerId = seats[table][seatIndex];
        const playersList = players.map(p => ({ id: p.id, name: p.name }));
        
        if (playersList.length === 0) {
            alert('Não há jogadores cadastrados');
            return;
        }
        
        const options = playersList.map(p => `${p.id}|${p.name}`).join(',');
        const newPlayerId = prompt(`Mover para ${table} - Cadeira ${seatIndex+1}\nDigite o ID do jogador:\n${playersList.map(p => `${p.id}: ${p.name}`).join('\n')}\n\nDeixe vazio para remover.`);
        
        if (newPlayerId === null) return;
        
        if (newPlayerId === '') {
            seats[table][seatIndex] = null;
        } else {
            const id = parseInt(newPlayerId);
            if (players.find(p => p.id === id)) {
                // Remover de onde estiver
                for (let t in seats) {
                    const idx = seats[t].indexOf(id);
                    if (idx !== -1) seats[t][idx] = null;
                }
                seats[table][seatIndex] = id;
            } else {
                alert('ID inválido');
                return;
            }
        }
        saveToStorage();
        updateAllDisplays();
    }

    function removePlayer(id) {
        if (confirm('Remover jogador? Isso também o removerá das mesas.')) {
            players = players.filter(p => p.id !== id);
            // Remover das mesas
            for (let t in seats) {
                seats[t] = seats[t].map(s => s === id ? null : s);
            }
            saveToStorage();
            updateAllDisplays();
        }
    }

    function exportExpenses() {
        if (players.length === 0) {
            alert('Nenhum jogador cadastrado');
            return;
        }
        
        let csv = "Nome,Valor Gasto (R$),Buy-in,Rebuys,Add-ons,Fichas\n";
        players.forEach(p => {
            csv += `"${p.name}",${p.totalPaid.toFixed(2)},${p.buyin ? 'Sim' : 'Não'},${p.rebuys},${p.addons},${p.chips}\n`;
        });
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute('download', 'gastos_poker.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function exportSeats() {
        let csv = "Mesa,Posição,Jogador\n";
        seats.preta.forEach((playerId, idx) => {
            const player = players.find(p => p.id === playerId);
            csv += `Preta,${idx+1},"${player ? player.name : 'Vazio'}"\n`;
        });
        seats.amarela.forEach((playerId, idx) => {
            const player = players.find(p => p.id === playerId);
            csv += `Amarela,${idx+1},"${player ? player.name : 'Vazio'}"\n`;
        });
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute('download', 'posicoes_mesas.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function resetTournament() {
        if (confirm('⚠️ Isso irá resetar TODO o torneio, incluindo jogadores, fichas e configurações. Deseja continuar?')) {
            players = [];
            seats = { preta: Array(10).fill(null), amarela: Array(10).fill(null) };
            timerSeconds = 0;
            saveToStorage();
            updateAllDisplays();
            alert('Torneio resetado com sucesso!');
        }
    }

    // Cronômetro
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timerSeconds++;
            updateTimerDisplay();
            saveToStorage();
        }, 1000);
    }

    function updateTimerDisplay() {
        const hours = Math.floor(timerSeconds / 3600);
        const minutes = Math.floor((timerSeconds % 3600) / 60);
        const seconds = timerSeconds % 60;
        document.getElementById('timerDisplay').innerHTML = 
            `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    // Expor funções globais
    window.addPlayer = addPlayer;
