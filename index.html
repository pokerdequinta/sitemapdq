<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Rebuys e Add-ons - Poker Tournament</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #0e2a1a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #ccc;
            margin-bottom: 30px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .players-panel {
            background: rgba(0,0,0,0.85);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #ffd700;
        }

        .config-panel {
            background: rgba(0,0,0,0.85);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #ffd700;
        }

        .panel-title {
            font-size: 1.3em;
            color: #ffd700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ffd700;
        }

        .players-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .player-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .player-name {
            font-weight: bold;
            color: #ffd700;
            min-width: 100px;
        }

        .player-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 8px;
        }

        .control-group label {
            color: #ccc;
            font-size: 12px;
        }

        .control-group button {
            background: #28a745;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .control-group button.minus {
            background: #dc3545;
        }

        .control-group span {
            color: #00ff00;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .chips-total {
            color: #00ffff;
            font-size: 12px;
            min-width: 100px;
        }

        .config-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .config-field {
            flex: 1;
        }

        .config-field label {
            display: block;
            color: #ffd700;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .config-field input {
            width: 100%;
            padding: 8px;
            background: #1a1a2e;
            border: 1px solid #ffd700;
            border-radius: 5px;
            color: white;
        }

        .btn {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
            margin-top: 10px;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-copy {
            background: #007bff;
            color: white;
        }

        pre {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 10px;
            max-height: 500px;
            overflow-y: auto;
            color: #00ff00;
            font-family: monospace;
            margin-top: 15px;
        }

        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
        }

        .status.success {
            background: #28a745;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 EDITOR DE REBUYS E ADD-ONS 🎰</h1>
        <div class="subtitle">Altere os valores e clique em "GERAR CÓDIGO"</div>

        <div class="main-content">
            <!-- Lista de Jogadores -->
            <div class="players-panel">
                <div class="panel-title">👥 JOGADORES</div>
                <div id="playersList" class="players-list"></div>
            </div>

            <!-- Configurações e Código -->
            <div class="config-panel">
                <div class="panel-title">⚙️ CONFIGURAÇÕES</div>
                
                <div class="config-row">
                    <div class="config-field">
                        <label>Fee Buy-in (R$)</label>
                        <input type="number" id="buyinFee" value="30">
                    </div>
                    <div class="config-field">
                        <label>Fee Rebuy (R$)</label>
                        <input type="number" id="rebuyFee" value="20">
                    </div>
                    <div class="config-field">
                        <label>Fee Add-on (R$)</label>
                        <input type="number" id="addonFee" value="50">
                    </div>
                </div>
                <div class="config-row">
                    <div class="config-field">
                        <label>Chips por Buy-in/Rebuy</label>
                        <input type="number" id="chipsBuyin" value="15000">
                    </div>
                    <div class="config-field">
                        <label>Chips por Add-on</label>
                        <input type="number" id="chipsAddon" value="50000">
                    </div>
                    <div class="config-field">
                        <label>Round do Add-on</label>
                        <input type="number" id="addonRound" value="10">
                    </div>
                </div>

                <button class="btn" onclick="generateCode()">🔧 GERAR CÓDIGO</button>
                <button class="btn btn-copy" onclick="copyCode()">📋 COPIAR</button>
                <button class="btn btn-success" onclick="resetToOriginal()">🔄 RESETAR ORIGINAL</button>

                <div id="status" class="status"></div>

                <pre id="codeOutput">Clique em "GERAR CÓDIGO" para visualizar...</pre>
            </div>
        </div>
    </div>

    <script>
        // Dados originais dos jogadores com seus UUIDs
        let players = [
            { uuid: "1935c2e2-84b8-434f-bbdd-c3bf290139ba", nickname: "Gregory", rebuys: 0, addons: 0, baseTime: 1776803015639 },
            { uuid: "2fc127c1-694e-424c-9e12-887ea0a5b6ae", nickname: "Andre", rebuys: 0, addons: 0, baseTime: 1776803009249 },
            { uuid: "d6a2925b-e405-4532-806a-a2481de59f43", nickname: "Eduardo", rebuys: 0, addons: 0, baseTime: 1776803009249 },
            { uuid: "ebb484c0-d0c1-4ec9-8066-8f2a7dd5d394", nickname: "Julinho", rebuys: 0, addons: 0, baseTime: 1776803009249 },
            { uuid: "65e3fe0d-ffe8-48e0-a2bb-b938b1583c96", nickname: "Leno", rebuys: 0, addons: 0, baseTime: 1776803009249 },
            { uuid: "fa41f9f6-4389-4cab-a70b-0c2e576bf593", nickname: "Long", rebuys: 0, addons: 0, baseTime: 1776803009249 },
            { uuid: "76ab831b-2dd9-4c6d-8e5d-3419e532454a", nickname: "Matheus", rebuys: 0, addons: 0, baseTime: 1776803009249 },
            { uuid: "4d80120c-201e-4d2e-bde8-b17be08a6a8c", nickname: "Ricardo", rebuys: 0, addons: 0, baseTime: 1776803009249 },
            { uuid: "8665b998-25c3-45d1-83ae-290b0f28f9a0", nickname: "Roberto", rebuys: 0, addons: 0, baseTime: 1776803009249 },
            { uuid: "38b39c66-f546-4471-ad38-5599a99cf105", nickname: "Sergio", rebuys: 0, addons: 0, baseTime: 1776803009249 },
            { uuid: "c77d6f73-3582-4433-942d-4836cce86101", nickname: "Tigre", rebuys: 0, addons: 0, baseTime: 1776803009249 }
        ];

        function renderPlayers() {
            const container = document.getElementById('playersList');
            container.innerHTML = players.map((player, idx) => {
                const chipsBuyin = parseInt(document.getElementById('chipsBuyin').value);
                const chipsAddon = parseInt(document.getElementById('chipsAddon').value);
                const totalChips = chipsBuyin + (player.rebuys * chipsBuyin) + (player.addons * chipsAddon);
                
                return `
                    <div class="player-card">
                        <span class="player-name">${player.nickname}</span>
                        <div class="player-controls">
                            <div class="control-group">
                                <label>🔁 Rebuys:</label>
                                <button class="minus" onclick="updateRebuys(${idx}, -1)">-</button>
                                <span>${player.rebuys}</span>
                                <button onclick="updateRebuys(${idx}, 1)">+</button>
                            </div>
                            <div class="control-group">
                                <label>💰 Add-ons:</label>
                                <button class="minus" onclick="updateAddons(${idx}, -1)">-</button>
                                <span>${player.addons}</span>
                                <button onclick="updateAddons(${idx}, 1)">+</button>
                            </div>
                            <div class="chips-total">
                                💎 ${totalChips.toLocaleString()} fichas
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateRebuys(index, delta) {
            players[index].rebuys = Math.max(0, players[index].rebuys + delta);
            renderPlayers();
        }

        function updateAddons(index, delta) {
            players[index].addons = Math.max(0, players[index].addons + delta);
            renderPlayers();
        }

        function resetToOriginal() {
            players = players.map(p => ({ ...p, rebuys: 0, addons: 0 }));
            renderPlayers();
            showStatus("Valores resetados para zero!", "success");
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            setTimeout(() => {
                statusDiv.className = 'status';
                statusDiv.textContent = '';
            }, 3000);
        }

        function generateCode() {
            const buyinFee = parseInt(document.getElementById('buyinFee').value);
            const rebuyFee = parseInt(document.getElementById('rebuyFee').value);
            const addonFee = parseInt(document.getElementById('addonFee').value);
            const chipsBuyin = parseInt(document.getElementById('chipsBuyin').value);
            const chipsAddon = parseInt(document.getElementById('chipsAddon').value);
            const addonRound = parseInt(document.getElementById('addonRound').value);

            const baseTime = 1776803009249;
            const rebuyTime = 1776803010000;
            const addonTime = 1776803020000;

            let playersMapEntries = [];

            players.forEach((player, idx) => {
                // Construir Buyins (1 buy-in + rebuys)
                let buyinsArray = [];
                
                // Buy-in inicial
                buyinsArray.push(`new GameBuyin({Time: ${player.baseTime}, Round: 1, Amount: ${buyinFee}, PersonalBounty: 0, Rake: new PerPlayerRake([0]), Chips: ${chipsBuyin}, Points: 0, ProfileName: "Master"})`);
                
                // Rebuys
                for (let i = 0; i < player.rebuys; i++) {
                    buyinsArray.push(`new GameBuyin({Time: ${rebuyTime + i * 1000}, Round: 1, Amount: ${rebuyFee}, PersonalBounty: 0, Rake: new PerPlayerRake([0]), Chips: ${chipsBuyin}, Points: 0, ProfileName: "Master"})`);
                }

                // AddOns
                let addonsArray = [];
                for (let i = 0; i < player.addons; i++) {
                    addonsArray.push(`new GameAddOn({Time: ${addonTime + i * 1000}, Round: ${addonRound}, Amount: ${addonFee}, Rake: new PerPlayerRake([0]), Chips: ${chipsAddon}, Points: 0, ProfileName: "Master"})`);
                }

                const totalChips = chipsBuyin + (player.rebuys * chipsBuyin) + (player.addons * chipsAddon);
                const lastModified = 1776802998912;

                const playerEntry = `["${player.uuid}", new GamePlayer({ UUID: "${player.uuid}", Name: new PlayerName({UUID: "${player.uuid}", Nickname: "${player.nickname}", Firstname: "", Lastname: "", LastModified: ${lastModified}}), Info: new PlayerInfo({UUID: "${player.uuid}", StreetAddress: "", City: "", State: "", Zipcode: "", Country: "", Phone1: "", Phone2: "", Email1: "", Email2: "", Notes: "", LastModified: ${lastModified}, OptID: ""}), Buyins: [${buyinsArray.join(', ')}], AddOns: [${addonsArray.join(', ')}], CashAdjustment: 0, PointsAdjustment: 0, ChipCount: ${totalChips}, NumberOfTableMoves: 1, PaidInFull: true, HitsAdjustment: 0 })]`;
                
                playersMapEntries.push(playerEntry);
            });

            // Seats array
            const seatsArray = players.map(p => `"${p.uuid}"`).join(', ');
            const locksArray = players.map(() => 'false').join(', ');

            const fullCode = `{ V: "3.7.2", T: new Tournament({UUID: "1806768e-837c-485a-8e96-f1a12a5286d0", Title: "POKER DE QUARTA", Description: "", Notes: "", Financials: new FinancialConfig({Buyins: new BuyConfig({Allow: false, Profiles: [new FeeProfile({Name: "Master", Enabled: true, AllowChange: true, Fee: 30, Rake: new PerPlayerRake([0]), Chips: 15000, Points: 0, BountyChipCost: 0})], DefIndex: 0, LastRound: 0, MaxPerPlayer: 0, MaxTotal: 0, MinPlayers: 0}), AddOns: new BuyConfig({Allow: false, Profiles: [new FeeProfile({Name: "Master", Enabled: true, AllowChange: true, Fee: 50, Rake: new PerPlayerRake([0]), Chips: 50000, Points: 0, BountyChipCost: 0})], DefIndex: 0, LastRound: 0, MaxPerPlayer: 0, MaxTotal: 0, MinPlayers: 0}), Rebuys: new BuyConfig({Allow: true, Profiles: [new FeeProfile({Name: "Master", Enabled: true, AllowChange: true, Fee: 20, Rake: new PerPlayerRake([0]), Chips: 15000, Points: 0, BountyChipCost: 0})], DefIndex: 0, LastRound: 10, MaxPerPlayer: 0, MaxTotal: 0, MinPlayers: 0}), FixedRake: new FixedRakeConfig({Type: 0, Real: new PerPlayerRake([180]), Percent: new PerPlayerRake([0]), Round: 0, RoundToNearest: 1}), HouseContribution: 0, GuaranteedPot: 0, TotalChipsAdjustment: 0, PointsForHit: 0, PointsForPlaying: new UserFormula({Text: "", Strict: false}), UseBounties: false, RestrictedBounty: true, AllowInTourneyRebuys: true, AllowRebuyOverrideAfterBustout: true}), Players: new GamePlayers({Players: Map.from([${playersMapEntries.join(', ')}]), Chops: new GameChops({Chops: []}), Config: new GamePlayersConfig({TrackPlayers: true, NumberOfEntries: 0, NumberOfPlayers: 0, NumberOfRebuys: 0, NumberOfAddOns: 0, FullCreditHit: false})}), Levels: new GameLevels({Levels: [new GameRound({Minutes: 15, SmallBlind: 100, BigBlind: 200, Ante: 0, GameType: 2, GameName: "Texas Hold 'Em", Tokens: new TokenOverrides({Tokens: Map.from([])}), Limits: [100, 200, 100, 200, 100, 200, 100, 200], Notes: ""})]}), Prizes: new GamePrizes({Prizes: [new GamePrize({Description: "1 Lugar", Type: 0, Recipient: 1, AmountType: 0, Amount: 46, Adjustment: 0, ShareRemainder: true, Points: 0, AwardedToPlayers: [], SharedRemainder: 0, CalculatedAmount: 70, CalculatedPoints: 0, EstimatedAmount: 0, EstimatedSharedRemainder: 0, Display: true, Lock: false}), new GamePrize({Description: "2 Lugar", Type: 0, Recipient: 2, AmountType: 0, Amount: 27, Adjustment: 0, ShareRemainder: false, Points: 0, AwardedToPlayers: [], SharedRemainder: 0, CalculatedAmount: 40, CalculatedPoints: 0, EstimatedAmount: 0, EstimatedSharedRemainder: 0, Display: true, Lock: false}), new GamePrize({Description: "3 Lugar", Type: 0, Recipient: 3, AmountType: 0, Amount: 17, Adjustment: 0, ShareRemainder: false, Points: 0, AwardedToPlayers: [], SharedRemainder: 0, CalculatedAmount: 30, CalculatedPoints: 0, EstimatedAmount: 0, EstimatedSharedRemainder: 0, Display: true, Lock: false}), new GamePrize({Description: "4 Lugar", Type: 0, Recipient: 4, AmountType: 0, Amount: 10, Adjustment: 0, ShareRemainder: false, Points: 0, AwardedToPlayers: [], SharedRemainder: 0, CalculatedAmount: 20, CalculatedPoints: 0, EstimatedAmount: 0, EstimatedSharedRemainder: 0, Display: true, Lock: false})], RoundPrizes: 2, RoundToNearest: 10, EstimatedPotInfo: new EstimatedPotData({UseEstimatedPot: false, EstimatedPot: 0, CalculateEstimatedPot: false, NumberOfBuyins: 0, NumberOfRebuys: 0, NumberOfAddOns: 0, CalculatedPot: 0, ShowEstimatedPot: false}), Automatic: false, AutomaticAtTop: true}), Chips: new GameChips({Chips: [new GameChip({ChipID: "1", Label: "White", ImagePath: "images\\\\chip_white.gif", Value: 100, Use: true, PerPlayer: 0}), new GameChip({ChipID: "2", Label: "Red", ImagePath: "images\\\\chip_red.gif", Value: 500, Use: true, PerPlayer: 0}), new GameChip({ChipID: "3", Label: "Blue", ImagePath: "images\\\\chip_blue.gif", Value: 1000, Use: true, PerPlayer: 0}), new GameChip({ChipID: "4", Label: "Black", ImagePath: "images\\\\chip_black.gif", Value: 5000, Use: true, PerPlayer: 0})], ChipSets: [new             document.getElementById('codeOutput').innerText = fullCode;
            showStatus("✅ Código gerado com sucesso!", "success");
        }

        function copyCode() {
            const code = document.getElementById('codeOutput').innerText;
            navigator.clipboard.writeText(code);
            showStatus("📋 Código copiado!", "success");
        }

        // Inicializar
        renderPlayers();
    </script>
</body>
</html>
